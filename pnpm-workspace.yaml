packages:
  - apps/dev-docs
  - packages/*
  # 桌面主入口是 vendored 的 OpenClaude Desktop 壳，它的 renderer 由自己的 vite
  # 配置构建，依赖必须由 workspace 安装：否则干净检出（CI）构建时报
  # Rolldown failed to resolve import "react-markdown"。该包 private，不发布。
  - packages/desktop/vendor/open-claude-desktop/app
  - apps/zcode-cli
  - apps/zcode-cli/packages/*
  - apps/zcode-cli/tools/*
supportedArchitectures:
  os:
    - current
    - darwin
    - linux
    - win32
  cpu:
    - current
    - x64
    - arm64
  libc:
    - current
    - glibc
allowBuilds:
  cpu-features: true
  edgedriver: true
  electron: true
  electron-winstaller: true
  esbuild: true
  geckodriver: true
  koffi: true
  msw: true
  node-pty: true
  protobufjs: true
  ssh2: true
  unsafe-pointer: true
